# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com

# The lines below are called `modelines`. See `:help modeline`
# Feel free to remove those if you don't want/need to use them.
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: chairlift

git:
  # Allow non-semver tags for snapshot builds
  ignore_tags:
    - continuous

snapshot:
  # Use a static version template that doesn't require parsing existing tags
  version_template: "{{ .ShortCommit }}-snapshot"

gomod:
  proxy: true

before:
  hooks:
    - go mod tidy


builds:
  - id: chairlift
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      # {{ .Tag }}, not {{ .Version }}: the calendar scheme is vYY.MM.N and
      # GoReleaser's semver parser normalises 26.09.0 to 26.9.0, which would
      # drop the zero that makes the version read as a date. Trim only the
      # leading "v" so the About dialog shows 26.09.0-alpha.1.
      - -s -w -X main.buildVersion={{ trimprefix .Tag "v" }}
    main: ./cmd/chairlift/main.go

  - id: chairlift-updex-helper
    binary: chairlift-updex-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
    main: ./cmd/chairlift-updex-helper/main.go

  - id: chairlift-ublue-helper
    binary: chairlift-ublue-helper
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
    main: ./cmd/chairlift-ublue-helper/main.go

archives:
  - files:
      - README.md
      - LICENSE
      - config.yml
      - data/chairlift-wrapper.sh
      - data/io.projectbluefin.chairlift.desktop
      - data/io.projectbluefin.chairlift.livery.gschema.xml
      - data/io.projectbluefin.chairlift.updates.gschema.xml
      - data/io.projectbluefin.chairlift.firstrun.gschema.xml
      - data/icons/**/*
      - data/icons/NOTICE
      - data/io.projectbluefin.chairlift.bootc.policy
      - data/io.projectbluefin.chairlift.updex.policy
      - data/io.projectbluefin.chairlift.sysupdate.policy
      - data/io.projectbluefin.chairlift.ublue.policy
      - channels.example.yml


checksum:
  name_template: "checksums.txt"

sboms:
  # Machine-readable bill of materials for every published archive, so signers
  # and verifiers have provenance alongside the binary.
  - artifacts: archive

signs:
  # Keyless cosign signing (Fulcio/Rekor) of the archives and the checksums
  # file. Requires the id-token: write permission in .github/workflows/release
  # and the cosign binary installed there. Emits <asset>.sigstore.json
  # alongside each asset. Verify against the release notes instructions below.
  - id: cosign-archives
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: archive

  - id: cosign-checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^test:"
      - "^chore"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: "^.*feat\\(deps\\)*:+.*$"
      order: 300
    - title: "New Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 100
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 200
    - title: "Documentation updates"
      regexp: "^.*docs[(\\w)]*:+.*$"
      order: 400
    - title: Other work
      order: 9999

nfpms:
  # Self-contained system package: app plus privileged integration.
  - id: chairlift
    ids:
      - chairlift
      - chairlift-updex-helper
      - chairlift-ublue-helper
    file_name_template: "{{ .ConventionalFileName }}"
    package_name: projectbluefin-chairlift
    # Every build id's binary (chairlift, chairlift-updex-helper,
    # chairlift-ublue-helper) is packaged automatically into bindir; do not
    # add them as contents entries (build outputs live in dist/, not the
    # repo root).
    bindir: /usr/bin
    maintainer: "Brian Ketelsen <bketelsen@gmail.com>"
    description: |-
      Control Center, the system management app for bootc-based installations (code name ChairLift).
      Manage flatpaks, homebrew and system updates with a modern GTK4/Libadwaita interface.
    license: GPL-3.0-or-later
    conflicts:
      - projectbluefin-chairlift-system-integration
    # Mandatory runtime dependencies (issue #89): the GUI dlopens the GTK4
    # and Libadwaita shared libraries at package-init time through puregotk
    # (libgtk-4.so.1, libadwaita-1.so.0), and the desktop entry always
    # launches /usr/bin/chairlift-wrapper, a Bash script
    # (data/chairlift-wrapper.sh). Dependency package names differ per
    # format (Debian libgtk-4-1/libadwaita-1-0, Fedora gtk4/libadwaita,
    # Alpine gtk4.0/libadwaita), so they are declared per format here. Do
    # not move them into one base-level dependencies list: a base list
    # would apply one format's names to the other formats, and GoReleaser
    # merges each format's overrides over the base fields with a
    # replace-not-append slice merge, so a base list coexisting with a
    # per-format one is silently dropped. internal/installcheck's
    # TestGoreleaserDeclaresMandatoryRuntimeDependencies holds this contract.
    overrides:
      deb:
        dependencies:
          - bash
          - libadwaita-1-0
          - libgtk-4-1
      rpm:
        dependencies:
          - bash
          - gtk4
          - libadwaita
      apk:
        dependencies:
          - bash
          - gtk4.0
          - libadwaita
    contents:
      # Wrapper script
      - src: ./data/chairlift-wrapper.sh
        dst: /usr/bin/chairlift-wrapper
        file_info:
          mode: 0755
      # Desktop file
      - src: ./data/io.projectbluefin.chairlift.desktop
        dst: /usr/share/applications/io.projectbluefin.chairlift.desktop
      # GSettings schemas, backing the Livery, Updates, and First-Run settings. They are not
      # in the system-integration package: that package ships no GUI, and
      # nothing but these pages reads these keys. The postinstall script
      # recompiles the schema cache, without which GSettings cannot see them.
      - src: ./data/io.projectbluefin.chairlift.livery.gschema.xml
        dst: /usr/share/glib-2.0/schemas/io.projectbluefin.chairlift.livery.gschema.xml
        file_info:
          mode: 0644
      - src: ./data/io.projectbluefin.chairlift.updates.gschema.xml
        dst: /usr/share/glib-2.0/schemas/io.projectbluefin.chairlift.updates.gschema.xml
        file_info:
          mode: 0644
      - src: ./data/io.projectbluefin.chairlift.firstrun.gschema.xml
        dst: /usr/share/glib-2.0/schemas/io.projectbluefin.chairlift.firstrun.gschema.xml
        file_info:
          mode: 0644
      # Package-maintainer defaults; never install into the administrator-owned /etc path
      - src: ./config.yml
        dst: /usr/share/chairlift/config.yml
        file_info:
          mode: 0644
      # Icons
      - src: ./data/icons/hicolor/scalable/apps/io.projectbluefin.chairlift.svg
        dst: /usr/share/icons/hicolor/scalable/apps/io.projectbluefin.chairlift.svg
      - src: ./data/icons/hicolor/symbolic/apps/io.projectbluefin.chairlift-symbolic.svg
        dst: /usr/share/icons/hicolor/symbolic/apps/io.projectbluefin.chairlift-symbolic.svg
      # PolicyKit policy for bootc
      - src: ./data/io.projectbluefin.chairlift.bootc.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.bootc.policy
        file_info:
          mode: 0644
      # PolicyKit policy for updex
      - src: ./data/io.projectbluefin.chairlift.updex.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.updex.policy
        file_info:
          mode: 0644
      # PolicyKit policy for native A/B sysupdate staging
      - src: ./data/io.projectbluefin.chairlift.sysupdate.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.sysupdate.policy
        file_info:
          mode: 0644
      # PolicyKit policy for the Bluefin-family channel/developer helper
      - src: ./data/io.projectbluefin.chairlift.ublue.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.ublue.policy
        file_info:
          mode: 0644
      # Documented release-channel table template. Installed as an example
      # only: the live file is /usr/share/chairlift/channels.yml (image
      # maintainer) or /etc/chairlift/channels.yml (administrator), and
      # ChairLift's built-in table applies when neither exists.
      - src: ./channels.example.yml
        dst: /usr/share/doc/chairlift/channels.example.yml
        file_info:
          mode: 0644
      # Icon licensing notice and Bluefin artwork attribution
      - src: ./data/icons/NOTICE
        dst: /usr/share/doc/chairlift/NOTICE.icons
        file_info:
          mode: 0644
    # Recompile the system GSettings schema cache so the Livery page can see
    # ChairLift's schema. An installed but uncompiled schema is invisible to
    # GSettings, which the page would report as its settings being missing.
    scripts:
      postinstall: ./packaging/postinstall.sh
      postremove: ./packaging/postremove.sh
    formats:
      - deb
      - rpm
      - apk

  # Root-owned companion for a user-scoped app installation such as the
  # Homebrew cask. It intentionally retains ChairLift's fixed helper and
  # PolicyKit paths. Distros enabling bootc staging must separately provide
  # /usr/libexec/bootc-update-stage; native A/B hosts ship
  # /usr/libexec/snosi-sysupdate-stage with the OS image.
  - id: chairlift-system-integration
    ids:
      - chairlift-updex-helper
      - chairlift-ublue-helper
    file_name_template: "{{ .ConventionalFileName }}"
    package_name: projectbluefin-chairlift-system-integration
    bindir: /usr/bin
    maintainer: "Brian Ketelsen <bketelsen@gmail.com>"
    description: |-
      System integration for a user-scoped Control Center (ChairLift) installation.
      Installs the privileged updex and ublue helpers, PolicyKit policies, and maintainer configuration defaults.
    license: GPL-3.0-or-later
    # Deliberately no dependencies (see TestGoreleaserDeclaresMandatoryRuntimeDependencies):
    # this package ships no GUI, no desktop entry, and no wrapper script —
    # only the pure-Go helper binaries and root-owned data files — so it must
    # stay installable on hosts that carry no GTK/Libadwaita stack at all.
    conflicts:
      - projectbluefin-chairlift
    contents:
      - src: ./config.yml
        dst: /usr/share/chairlift/config.yml
        file_info:
          mode: 0644
      - src: ./data/io.projectbluefin.chairlift.bootc.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.bootc.policy
        file_info:
          mode: 0644
      - src: ./data/io.projectbluefin.chairlift.updex.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.updex.policy
        file_info:
          mode: 0644
      - src: ./data/io.projectbluefin.chairlift.sysupdate.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.sysupdate.policy
        file_info:
          mode: 0644
      - src: ./data/io.projectbluefin.chairlift.ublue.policy
        dst: /usr/share/polkit-1/actions/io.projectbluefin.chairlift.ublue.policy
        file_info:
          mode: 0644
      - src: ./channels.example.yml
        dst: /usr/share/doc/chairlift/channels.example.yml
        file_info:
          mode: 0644
    formats:
      - deb
      - rpm
      - apk

release:
  prerelease: auto
  header: |
    ## Verifying this release

    The archives and `checksums.txt` in this release are signed keyless with
    [cosign](https://docs.sigstore.dev/) (Fulcio/Rekor). A Sigstore bundle (`.sigstore.json`)
    ships alongside each asset. Verify an archive:

    ```bash
    cosign verify-blob \
      --bundle <archive>.tar.gz.sigstore.json \
      --certificate-identity-regexp "^https://github\\.com/projectbluefin/chairlift/\\.github/workflows/release\\.yml@refs/tags/.+$" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      <archive>.tar.gz
    ```

    Verify the checksum file the same way, replacing the paths with
    `checksums.txt.sigstore.json` and `checksums.txt`. Then confirm asset integrity
    against the signed checksums:

    ```bash
    sha256sum --ignore-missing -c checksums.txt
    ```
  footer: |
    **Full Changelog**: https://github.com/projectbluefin/chairlift/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    _Released with [GoReleaser](https://goreleaser.com)!_
