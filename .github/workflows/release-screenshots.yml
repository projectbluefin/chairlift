name: Release screenshots

# Regenerates docs/screenshots/*.png from the real app and opens (or updates)
# a pull request against main with any change, once per published release —
# so the README and walkthrough always picture what's actually shipping,
# without anyone remembering to run `make screenshots` by hand.
#
# A pull request, not a push: main's ruleset requires the merge queue, one
# approval, and the "Tests Passed" check, so a direct `git push origin main`
# is rejected. The pull request is opened with a MergeRaptor GitHub App token
# rather than GITHUB_TOKEN because pull requests GITHUB_TOKEN creates never
# trigger workflow runs, which would leave "Tests Passed" pending forever. For
# the same reason the commit carries no `[skip ci]`: the merge queue waits on
# that required check. Auto-merge is requested, but the queue still needs a
# human approval.
#
# Triggered by `workflow_run` on release.yml's "goreleaser" workflow, NOT by
# `release: published`. That would be the obvious choice — GoReleaser
# publishes the GitHub Release as its last step, so it'd only fire once that
# actually succeeded — but it silently never fires in practice: GoReleaser
# authenticates with the default GITHUB_TOKEN, and GitHub does not trigger
# new workflow runs from events created by GITHUB_TOKEN (the standard
# loop-prevention rule). Confirmed on v0.12.1: the release published cleanly
# and no "Release screenshots" run ever appeared. `workflow_run` is exempt
# from that rule and is the documented workaround.
#
# Deliberately not run per-push (see docs/walkthrough.md "How these are
# made" — font/theme drift would churn the repo on every commit); tying it to
# releases instead gives every regeneration a natural, infrequent cadence and
# a reason (something shipped) rather than a schedule.
on:
  workflow_run:
    workflows: [goreleaser]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to screenshot (defaults to the latest release)"
        required: false

# The job's own token only reads; every write goes through the app token.
permissions:
  contents: read

concurrency:
  group: release-screenshots
  cancel-in-progress: false

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.tag || 'workflow_dispatch' }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.tag || '' }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      # Same package list as test.yml's E2E job — see that workflow's
      # comment for why each package is here: x11-apps for xwd (a separate
      # Debian/Ubuntu package from x11-utils) and flatpak so the update
      # shell finds at least one reachable source (Homebrew is on
      # the runner but not on PATH; bootc is never present in a container).
      - name: Install headless GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            adwaita-icon-theme \
            dbus-x11 \
            flatpak \
            imagemagick \
            libadwaita-1-0 \
            libgtk-4-1 \
            x11-apps \
            x11-utils \
            xauth \
            xdotool \
            xvfb

      - name: Regenerate walkthrough screenshots
        run: make screenshots

      # The tag is a point in time; main may have moved since it was cut.
      # Build against the tag (so the screenshots picture exactly what was
      # released), then land the result on current main rather than on the
      # immutable tag: stash the regenerated PNGs, switch to main, and copy
      # them back in — simpler and safer than cherry-picking across a branch
      # switch.
      - name: Stash regenerated screenshots
        run: |
          mkdir -p /tmp/screenshots-out
          cp -a docs/screenshots/. /tmp/screenshots-out/

      - name: Switch to main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Replace screenshots on main
        run: |
          rm -rf docs/screenshots
          mkdir -p docs/screenshots
          cp -a /tmp/screenshots-out/. docs/screenshots/

      - name: Mint MergeRaptor token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.MERGERAPTOR_APP_ID }}
          private-key: ${{ secrets.MERGERAPTOR_PRIVATE_KEY }}

      # RELEASE_TAG is drawn from an attacker-influenceable git ref name
      # (head_branch) or a free-text workflow_dispatch input. Action inputs
      # are data, not shell, so ${{ env.RELEASE_TAG }} is safe in `with:`;
      # it must never be interpolated into a `run:` script with ${{ }}.
      - name: Open screenshot pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: release-screenshots
          base: main
          add-paths: docs/screenshots
          commit-message: "docs: refresh walkthrough screenshots for ${{ env.RELEASE_TAG }}"
          title: "docs: refresh walkthrough screenshots for ${{ env.RELEASE_TAG }}"
          body: "Regenerated by `make screenshots` from release ${{ env.RELEASE_TAG }} (release-screenshots.yml)."
          delete-branch: true

      - name: Request auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
