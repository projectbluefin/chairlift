name: Nightly compliance

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-compliance
  cancel-in-progress: false

jobs:
  compliance:
    name: Full compliance suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install compliance tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Install E2E runtime
        id: runtime
        uses: ./.github/actions/e2e-runtime

      - name: Run host-independent compliance gates
        run: make ci

      - name: Run end-to-end compliance gates
        env:
          CHAIRLIFT_ATSPI_PYTHON: ${{ steps.runtime.outputs.python }}
          CHAIRLIFT_REQUIRE_ATSPI: "1"
        run: make e2e

      - name: Run AT-SPI suite on Dakota
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install --quiet xorg-server
          make e2e-atspi

      - name: Scan Go code and dependencies for known vulnerabilities
        run: govulncheck ./...
