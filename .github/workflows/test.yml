name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue is a separate event: it builds each candidate on its own
  # temporary ref (refs/heads/gh-readonly-queue/main/pr-<n>-<sha>), and
  # neither `push` nor `pull_request` fires for it. Without this trigger the
  # queue has nothing to wait for and merges unvalidated heads.
  #
  # Deliberately unfiltered. `github.ref` here is the queue ref, never `main`,
  # so a `branches: [main]` filter would match nothing and silently restore
  # the ungated queue this trigger exists to fix. The queue runs only on the
  # default branch anyway, so there is nothing to filter out.
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov's tokenless OIDC upload needs this job-scoped permission.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests with coverage
        run: go test -v ./internal/... -coverprofile=coverage.out -covermode=atomic -run "^Test[^I]" -skip "Integration"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  race-test:
    name: Race Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detector
        run: go test -race -short ./internal/... -run "^Test[^I]" -skip "Integration"

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install E2E runtime
        id: runtime
        uses: ./.github/actions/e2e-runtime

      - name: Run E2E tests
        env:
          CHAIRLIFT_WALKTHROUGH_DIR: ${{ github.workspace }}/walkthrough
          CHAIRLIFT_SCHEMA_DIR: ${{ github.workspace }}/build/schemas
          E2E_COVERDIR: ${{ github.workspace }}/covdata-e2e
          CHAIRLIFT_ATSPI_PYTHON: ${{ steps.runtime.outputs.python }}
          CHAIRLIFT_REQUIRE_ATSPI: "1"
        run: make e2e

      # The behave AT-SPI suite asserts what the accessibility tree announces,
      # which depends on the GTK/Libadwaita release, so it runs in the Dakota
      # image ChairLift ships on (podman), not on the runner's Ubuntu stack.
      # Homebrew provides an Xvfb the container can execute.
      - name: Run AT-SPI suite on Dakota
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_ENV_HINTS: "1"
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install --quiet xorg-server
          make e2e-atspi

      - name: Upload E2E coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: ./e2e-coverage.out
          flags: e2e
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

      - name: Upload walkthrough screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walkthrough-screenshots
          path: walkthrough/
          if-no-files-found: warn

      # JUnit XML, behave.log, and per-scenario logs, journals, accessibility
      # tree dumps and screenshots for any failed scenario. The per-scenario
      # HOME and runtime directories are excluded: they hold Homebrew caches
      # and sockets, not evidence.
      - name: Upload AT-SPI suite results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atspi-results
          path: |
            build/atspi/
            !build/atspi/*/bin/
            !build/atspi/*/home/
            !build/atspi/*/runtime/
            !build/atspi/*/scenarios/*/home/
            !build/atspi/*/scenarios/*/runtime/
            !build/atspi/*/scenarios/*/bin/
          if-no-files-found: warn

  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Check formatting
        run: |
          gofmt -l .
          test -z "$(gofmt -l .)"

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} make build
          ls -lh build/chairlift

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chairlift-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/chairlift
          retention-days: 7

  # The one check context the default-branch ruleset requires, for both pull
  # requests and merge groups. Requiring the individual jobs instead would
  # pin branch protection to names this file can rename or re-matrix — the
  # build job alone expands to "Build (linux, amd64)" and "Build (linux,
  # arm64)" — so the ruleset would drift out of step with CI silently. One
  # name that fans out here cannot.
  tests-passed:
    name: Tests Passed
    needs: [lint, unit-test, race-test, e2e, verify, build]
    # Required. Without it a failed dependency *skips* this job, and GitHub
    # counts a skipped required check as passing — which is the ungated merge
    # this whole workflow exists to prevent, only harder to see.
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every gate job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Gate job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A gate job concluded '${result}'; refusing to report success."
              exit 1
            fi
          done
