# .github/workflows/release.yml
name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions: {}

jobs:
  # The host-independent quality gate, run against the exact tagged commit
  # before anything publish-capable starts (closes #87, ADR-0021, ADR-0022).
  # Separate job with `contents: read` only so the release job's write scopes
  # are never granted to the test runner.
  gate:
    name: Host-independent quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Run host-independent quality gate
        run: make ci

  # The end-to-end quality gate, run against the exact tagged commit in a
  # headless GTK/Libadwaita environment before anything publish-capable starts.
  e2e:
    name: End-to-end quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install headless GTK runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dbus-x11 \
            flatpak \
            imagemagick \
            libadwaita-1-0 \
            libgtk-4-1 \
            x11-apps \
            x11-utils \
            xauth \
            xdotool \
            xvfb

      - name: Run E2E tests
        run: make e2e

  goreleaser:
    name: Release with GoReleaser
    needs: [gate, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless cosign signing (Fulcio/Rekor) exchanges an OIDC token for a
      # code-signing certificate, so the goreleaser job needs it.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to the exact toolchain in go.mod and every other job —
          # `stable` would let an unchanged tag rebuild against a newer
          # compiler. See ci pin Go and GoReleaser in the write-capable
          # release job (#88).
          go-version: "1.26.6"
      # GoReleaser OSS (free): publishes binaries, archives, and the rpm/deb/apk
      # nFPM packages straight to the GitHub Release for this tag. No Pro
      # license or external package-repo credentials needed.
      # Install cosign for keyless (Fulcio/Rekor) signing of the archives and
      # checksums file below. Needs the id-token: write permission above.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact reviewed release (latest stable v2 at time of #88);
          # `~> v2` would let the same tag publish under a newer GoReleaser.
          version: "v2.18.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
