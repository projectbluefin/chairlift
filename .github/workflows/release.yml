# .github/workflows/release.yml
name: goreleaser

on:
  push:
    # run only against tags
    tags:
      - "*"

permissions: {}

jobs:
  # The host-independent quality gate, run against the exact tagged commit
  # before anything publish-capable starts (closes #87, ADR-0021, ADR-0022).
  # Separate job with `contents: read` only so the release job's write scopes
  # are never granted to the test runner.
  gate:
    name: Host-independent quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          # A tag push publishes signed binaries: never restore a cache that
          # another workflow could have written into its validation jobs.
          cache: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Run host-independent quality gate
        run: make ci

  # The end-to-end quality gate, run against the exact tagged commit in a
  # headless GTK/Libadwaita environment before anything publish-capable starts.
  e2e:
    name: End-to-end quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for Dakota
        uses: projectbluefin/actions/bootc-build/setup-runner@d1f65645c53d413462117fe1f05d00b9d9382f89 # v1
        with:
          storage-backend: remove-software
          update-podman: "false"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          # A tag push publishes signed binaries: never restore a cache that
          # another workflow could have written into its validation jobs.
          cache: false

      # Run in the pinned Dakota image under a private Wayland session.
      - name: Run E2E tests
        env:
          CHAIRLIFT_SCHEMA_DIR: ${{ github.workspace }}/build/schemas
        run: make e2e

  # Match the pull-request shards; publishing waits for every shard.
  atspi:
    name: AT-SPI (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: features
            tags: "@features"
          - shard: apps
            tags: "@apps or @updates"
          - shard: livery
            tags: "@livery or @help"
          - shard: config
            tags: "@config or @maintenance or @agents or @navigation or @setup or @shell"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for Dakota
        uses: projectbluefin/actions/bootc-build/setup-runner@d1f65645c53d413462117fe1f05d00b9d9382f89 # v1
        with:
          storage-backend: remove-software
          update-podman: "false"
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Run AT-SPI suite shard on Dakota
        env:
          ATSPI_TAGS: ${{ matrix.tags }}
        run: make e2e-atspi

  goreleaser:
    name: Release with GoReleaser
    needs: [gate, e2e, atspi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      # Keyless cosign signing (Fulcio/Rekor) exchanges an OIDC token for a
      # code-signing certificate, so the goreleaser job needs it.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to the exact toolchain in go.mod and every other job —
          # `stable` would let an unchanged tag rebuild against a newer
          # compiler. See ci pin Go and GoReleaser in the write-capable
          # release job (#88).
          go-version: "1.27.4"
          # Do not restore or save Go caches in the write-capable release build;
          # prevents caches populated or modified by preceding gate/e2e jobs
          # from reaching the release binaries.
          cache: false
      # GoReleaser OSS (free): publishes the archives, checksums, SBOMs and
      # signatures straight to the GitHub Release for this tag. No Pro
      # license or external package-repo credentials needed.
      # Install cosign for keyless (Fulcio/Rekor) signing of the archives and
      # checksums file below. Needs the id-token: write permission above.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Exact reviewed release (latest stable v2 at time of #88);
          # `~> v2` would let the same tag publish under a newer GoReleaser.
          version: "v2.20.2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
