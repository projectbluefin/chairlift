# zizmor baseline for the "zizmor (workflow safety)" step in the required Lint
# job (.github/workflows/test.yml), which runs at --min-severity=medium
# --min-confidence=medium (projectbluefin/actions#674) and must stay green.
#
# Every entry below names a finding that exists on main today and says why it
# is accepted. Remove an entry as soon as the site it covers is fixed; never
# add one to silence a finding on new code without a reason next to it.
#
# Regenerate the list of current findings with:
#   zizmor --offline --no-config --min-severity=medium --min-confidence=medium .
#
# (--no-config is required: zizmor auto-discovers this file, so without it
# every baselined finding is suppressed and the command reports nothing.)
#
# Prefer filename:line over a bare filename so that a new finding elsewhere in
# the same file still fails the check.

rules:
  dangerous-triggers:
    ignore:
      # Prow needs a write token for fork pull requests so it can label and
      # merge them. Safe: nothing in prow.yml checks out or runs pull request
      # code; the reusable workflow only checks out cncf/prow-github-actions.
      - prow.yml:14 # issue_comment
      - prow.yml:19 # pull_request_target
      # PR screenshots: pull request code never runs beside the write token;
      # internal/installcheck/prscreenshots_test.go enforces that split.
      - pr-screenshots.yml:28 # issue_comment
      # Release screenshots: fires only after the tag-push goreleaser workflow
      # and builds the released tag, never pull request code.
      - release-screenshots.yml:32 # workflow_run
