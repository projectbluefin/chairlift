name: "Report something"
description: "Bugs, feature requests, and system diagnostics all start here."
labels: ["1-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## What happens after you submit

        This repository runs on a small, fixed set of labels. Automation moves
        them; you never need to set one yourself.

        | Label | What it means |
        |---|---|\n        | `1-triage` | Filed. A human is reading it. |\n        | `2-discussing` | Needs a decision or a clearer spec before anyone builds it. |\n        | `3-human-queue` | Accepted, queued for a person. |\n        | `3-clanker-queue` | Accepted, queued for an automated agent. |\n        | `4-review` | A pull request exists and is being reviewed. |\n        | `blocked` / `hold` | Waiting on something, or paused on purpose. |

        Your issue closes when a pull request saying `Closes #NNN` merges.
        There are no slash commands and nothing for you to claim.

        The clearer the finish line you describe, the sooner it can be picked
        up. Vague reports sit in triage.

  - type: textarea
    id: what
    attributes:
      label: "What happened, or what do you want?"
      description: "Be specific. For a bug, say what you saw and what you expected."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: "Reproduction or evidence"
      description: |
        Exact steps, logs, terminal outputs, or journal lines (`journalctl --user -u ...`).
    validations:
      required: true

  - type: input
    id: chairlift_version
    attributes:
      label: "ChairLift version"
      description: "Output of `chairlift --version` or package version."
      placeholder: "v0.12.2"
    validations:
      required: false

  - type: input
    id: image
    attributes:
      label: "Host OS image and version"
      description: "Output of `bootc status -v` or the tag/distro you booted."
      placeholder: "ghcr.io/projectbluefin/bluefin:stable"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: "Extra context"
    validations:
      required: false
