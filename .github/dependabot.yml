version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week before proposing a new release, so a hijacked or yanked
    # version has time to be caught upstream. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
