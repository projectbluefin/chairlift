# ChairLift Configuration
# This file controls which preference groups are shown in the application
# Set "enabled: false" to hide a preference group on any page. A functional
# page is omitted when all of its groups are disabled; Help is always retained.

# A language model served from a rootless container, on whichever accelerator
# this machine has. Shown everywhere Podman exists; the model is only
# downloaded once the switch is turned on.
#
# ai_images pins the container image per GPU vendor (nvidia, amd, intel,
# none) — for a site that mirrors registries — and ai_model changes what is
# served. Both are ordinary settings rather than root-only ones because the
# container runs unprivileged in the user's own account.
agents_page:
  agents_group:
    enabled: true
    # ai_images:
    #   nvidia: registry.example.internal/ramalama/cuda:latest
    # ai_model: ollama://qwen2.5:7b

updates_page:
  # Whether this system installs updates on its own schedule. Updating now
  # is the status-first shell's single action and needs no config key; this
  # switch is a preference about the future, so it gets its own group.
  #
  # Hidden entirely on a host with no unattended-update timer, so a machine
  # that cannot update itself never shows a switch that would do nothing.
  automatic_updates_group:
    enabled: true
  bootc_updates_group:
    enabled: true
  flatpak_updates_group:
    enabled: true
  brew_updates_group:
    enabled: true
  brew_trust_group:
    enabled: true
  # Which release stream this machine follows, and the graphics driver the
  # image carries. Both replace the operating system and need a restart, so
  # they sit with updates. Hidden on a host with no image information.
  channel_group:
    enabled: true
  # Compact system-version readout; technical identity stays behind details.
  bootc_status_group:
    enabled: true

applications_page:
  applications_installed_group:
    enabled: false
    app_id: io.github.kolunmi.Bazaar
  flatpak_user_group:
    enabled: false
  flatpak_system_group:
    enabled: false
  brew_group:
    enabled: false
  brew_search_group:
    enabled: false
  brew_bundles_group:
    enabled: true
    bundles_paths:
      - /usr/share/ublue-os/homebrew

maintenance_page:
  maintenance_cleanup_group:
    enabled: false
    actions:
      - title: Clean Up Boot Old Entries
        script: /usr/libexec/bls-gc
        sudo: true
  # One routine cleanup action. It removes cached downloads and unused
  # supporting software — never installed apps, documents, or containers.
  maintenance_freespace_group:
    enabled: true
  # Powerwash (remove every user Flatpak and Distrobox container) and Factory
  # Reset (bootc install reset --experimental). Both are irreversible, so
  # they ship disabled — the same default as maintenance_cleanup_group.
  reset_group:
    enabled: false

features_page:
  features_group:
    enabled: true
  # Capabilities you turn on. Each hides itself on a host with no
  # /usr/share/ublue-os/image-info.json, so leaving them enabled is safe on
  # every other system.
  #
  # install_pulp and stage_feeds are optional follow-on steps for a confirmed
  # Developer Mode enable, and both ship off. Turning the switch on grants
  # developer access either way; these only add a user-scope Pulp Flatpak and
  # a staged feed list the user imports themselves. Switching Developer Mode
  # back off removes neither, and never touches feeds already imported.
  dx_group:
    enabled: true
    # install_pulp: true
    # stage_feeds: true
  gaming_group:
    enabled: true
  # A language model served from a rootless container now lives on its own
  # Agents page; see agents_page above.

# Who you are, who you stand with, and what you roll with. Each livery
# section shadows one icon-theme name in the user's own theme; nothing here
# is privileged, and apart from the profile picture nothing is written
# outside $XDG_DATA_HOME/$XDG_CONFIG_HOME.
livery_page:
  # The account's profile picture, chosen from Project Bluefin's dinosaur
  # artwork. Nothing is downloaded until a picture is picked, and nothing is
  # set until Apply; it goes through AccountsService, unprivileged.
  account_group:
    enabled: true
  # The Show Applications mark, fetched from simpleicons.org by brand name.
  # Set once — there is no rotation, because a personal mark that changed on
  # its own would stop being personal.
  livery_app_grid_group:
    enabled: true
  # The top-bar menu mark. Needs the Custom Command Menu GNOME extension;
  # the section says so and stays insensitive where it is absent.
  livery_foundation_group:
    enabled: true
  # The Files application mark. GNOME stores one icon per application, so
  # this changes Files everywhere it is drawn, not only on the dock.
  livery_dock_group:
    enabled: true

help_page:
  # An AI assistant that can read this system's logs, services, and network
  # to help diagnose problems. Everything it installs comes from Homebrew, so
  # the group hides itself where Homebrew is absent. Nothing is downloaded
  # until the user presses Set Up.
  troubleshooting_group:
    enabled: true
  help_resources_group:
    enabled: true
    website: https://projectbluefin.io
    issues: https://github.com/projectbluefin/dakota/issues
    chat: https://docs.projectbluefin.io/
