# ChairLift Configuration
# This file controls which preference groups are shown in the application
# Set "enabled: false" to hide a preference group on any page. A functional
# page is omitted when all of its groups are disabled; Help is always retained.

system_page:
  system_info_group:
    enabled: true
  bootc_status_group:
    enabled: true
  # Which image this machine runs, and the graphics driver it carries. Hidden
  # on a host with no /usr/share/ublue-os/image-info.json.
  channel_group:
    enabled: true
  health_group:
    enabled: true
    app_id: io.missioncenter.MissionCenter

updates_page:
  # Update All leads the page; the per-provider groups below it remain
  # available for anything it does not cover.
  #
  # The Automatic Updates switch is rendered inside this group, because it
  # answers the same question — how does this system get updated — and
  # splitting it out would present two unrelated-looking settings. Disabling
  # this group therefore hides that switch too. There is deliberately no
  # separate key for it: an independent key could be enabled while this one
  # was disabled, which would leave the Updates page claiming a group it does
  # not draw.
  update_all_group:
    enabled: true
  bootc_updates_group:
    enabled: true
  sysupdate_updates_group:
    enabled: true
  flatpak_updates_group:
    enabled: true
  brew_updates_group:
    enabled: true
  brew_trust_group:
    enabled: true

applications_page:
  applications_installed_group:
    enabled: true
    app_id: io.github.kolunmi.Bazaar
  flatpak_user_group:
    enabled: true
  flatpak_system_group:
    enabled: true
  brew_group:
    enabled: true
  brew_search_group:
    enabled: true
  brew_bundles_group:
    enabled: true
    bundles_paths:
      - /usr/share/snow/bundles

maintenance_page:
  maintenance_cleanup_group:
    enabled: false
    actions:
      - title: Clean Up Boot Old Entries
        script: /usr/libexec/bls-gc
        sudo: true
  maintenance_brew_group:
    enabled: true
  maintenance_flatpak_group:
    enabled: true
  maintenance_optimization_group:
    enabled: true
  # Powerwash (remove every user Flatpak and Distrobox container) and Factory
  # Reset (bootc install reset --experimental). Both are irreversible, so
  # they ship disabled — the same default as maintenance_cleanup_group.
  reset_group:
    enabled: false

features_page:
  features_group:
    enabled: true
  # Capabilities you turn on. Each hides itself on a host with no
  # /usr/share/ublue-os/image-info.json, so leaving them enabled is safe on
  # every other system.
  dx_group:
    enabled: true
  gaming_group:
    enabled: true
  # A language model served from a rootless container, on whichever
  # accelerator this machine has. Shown everywhere Podman exists; the model
  # is only downloaded once the switch is turned on.
  #
  # ai_images pins the container image per GPU vendor (nvidia, amd, intel,
  # none) — for a site that mirrors registries — and ai_model changes what is
  # served. Both are ordinary settings rather than root-only ones because the
  # container runs unprivileged in the user's own account.
  ai_group:
    enabled: true
    # ai_images:
    #   nvidia: registry.example.internal/ramalama/cuda:latest
    # ai_model: ollama://qwen2.5:7b
  # An AI assistant that can read this system's logs, services, and network
  # to help diagnose problems. Everything it installs comes from Homebrew, so
  # the group hides itself where Homebrew is absent. Nothing is downloaded
  # until the user presses Set Up.
  troubleshooting_group:
    enabled: true

help_page:
  help_resources_group:
    enabled: true
    website: https://github.com/frostyard/snosi
    issues: https://github.com/frostyard/snosi/issues
    chat: https://github.com/frostyard/snosi/discussions
